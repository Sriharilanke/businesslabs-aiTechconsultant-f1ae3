<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tech Consultant — Enterprise Command Center</title>
  <meta http-equiv="refresh" content="0; url=frontend-dashboard/">
  <script>
    window.location.replace("frontend-dashboard/" + window.location.search + window.location.hash);
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000000;
      color: #FFE600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      border: 1px solid rgba(255, 230, 0, 0.4);
      background: radial-gradient(circle at top, rgba(255, 230, 0, 0.08) 0%, rgba(0, 0, 0, 0.95) 100%);
      padding: 40px 32px;
      border-radius: 16px;
      max-width: 520px;
      box-shadow: 0 0 40px rgba(255, 230, 0, 0.15);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      background: rgba(255, 230, 0, 0.15);
      border: 1px solid #FFE600;
      border-radius: 999px;
      margin-bottom: 16px;
      color: #FFE600;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: #FFE600;
    }
    p {
      color: #FFFFFF;
      font-size: 0.92rem;
      line-height: 1.6;
      margin: 8px 0;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: #FFE600;
      color: #000000;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 1px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 230, 0, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 230, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">JD4 Capstone Architecture</div>
    <h1>AI TECH CONSULTANT</h1>
    <p>Automated Knowledge Grounding · Inbox Agent · Scope Engine</p>
    <p style="color:rgba(255,255,255,0.7); font-size:0.82rem;">Redirecting to Enterprise Command Center...</p>
    <a href="frontend-dashboard/" class="btn">LAUNCH DASHBOARD ➔</a>
  </div>
</body>
</html>
