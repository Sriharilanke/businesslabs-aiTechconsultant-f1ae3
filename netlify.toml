# Netlify Configuration for AI Tech Consultant Enterprise Command Center

[build]
  publish = "frontend-dashboard"
  command = ""

[[redirects]]
  from = "/frontend-dashboard/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"
